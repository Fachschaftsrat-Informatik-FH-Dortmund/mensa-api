[workspace]
name = "mensa-api"
description = "Caching-Proxy vor der Stwdo-Speiseplan-API"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
go-nocgo = "1.27.*"
prettier = "3.9.*"

[tasks]
run = "go run ."
build = "go build -o bin/mensa-api ."
fmt = { depends-on = ["fmt-go", "fmt-prettier"] }
fmt-go = "go fmt ./..."
fmt-prettier = "prettier --write ."
check-fmt = "prettier --check ."
vet = "go vet ./..."
test = "go test ./..."
